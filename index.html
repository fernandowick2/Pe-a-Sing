<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votação - Peça Teatral Sing</title>
    <style>
        :root {
            --primary: #ffb703;
            --primary-hover: #fb8500;
            --bg: #0b090a;
            --card-bg: rgba(26, 26, 36, 0.95);
            --input-bg: #16161a;
            --text: #fffffe;
            --text-secondary: #94a1b2;
            --border: #2cb67d;
            --accent: #ff007f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(rgba(11, 9, 10, 0.7), rgba(11, 9, 10, 0.9)), url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=1200&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            padding: 50px 15px;
            text-align: center;
            border-bottom: 4px solid var(--primary);
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
        }

        .header-tag {
            color: var(--primary);
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 13px;
            margin-bottom: 8px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        header h1 {
            font-size: 2.8rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }

        header h2 {
            font-size: 1.3rem;
            color: var(--primary);
            font-weight: 500;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
        }

        header p {
            color: #e2e8f0;
            font-size: 1rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .admin-toggle {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .btn-admin {
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--text-secondary);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .btn-admin:hover {
            border-color: var(--text);
            color: var(--text);
            background-color: rgba(255,255,255,0.1);
        }

        .admin-panel {
            background-color: var(--card-bg);
            border: 1px dashed var(--primary);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            display: none;
            backdrop-filter: blur(5px);
        }

        .admin-panel.active {
            display: block;
        }

        .admin-panel h3 {
            margin-bottom: 15px;
            color: var(--primary);
            font-size: 1.2rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        @media (min-width: 768px) {
            .form-row {
                grid-template-columns: 1fr 1fr 1fr auto;
            }
            header h1 {
                font-size: 3.5rem;
            }
            header h2 {
                font-size: 1.6rem;
            }
        }

        input[type="text"], input[type="file"], textarea, select {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid #3f3f46;
            color: var(--text);
            border-radius: 4px;
            font-size: 1rem;
        }

        button.btn-primary {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button.btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .cast-list-admin {
            margin-top: 15px;
        }

        .cast-item-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background-color: var(--input-bg);
            margin-bottom: 8px;
            border-radius: 4px;
            border-left: 3px solid var(--primary);
            font-size: 0.9rem;
        }

        .btn-delete {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Área de Resultados */
        .results-box {
            background-color: var(--input-bg);
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            border: 1px solid #3f3f46;
        }

        .results-box h4 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .feedback-group {
            margin-bottom: 15px;
        }

        .feedback-target {
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .feedback-item {
            background-color: var(--card-bg);
            padding: 10px;
            border-left: 3px solid var(--primary);
            margin-bottom: 6px;
            font-style: italic;
            font-size: 0.95rem;
        }

        /* Seção do Elenco */
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary);
            padding-left: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        @media(min-width: 768px) {
            .section-title {
                font-size: 1.8rem;
            }
        }

        .grid-cast {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        @media(min-width: 600px) {
            .grid-cast {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 20px;
            }
        }

        .card-actor {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .card-actor img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #000;
        }

        @media(min-width: 600px) {
            .card-actor img {
                height: 240px;
            }
        }

        .card-info {
            padding: 12px;
        }

        .card-info h4 {
            font-size: 1.1rem;
            margin-bottom: 4px;
            color: #fff;
        }

        .card-info p {
            color: var(--primary);
            font-size: 0.85rem;
        }

        /* Formulário de Votação */
        .vote-section {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        @media(min-width: 768px) {
            .vote-section {
                padding: 30px;
            }
        }

        .vote-group {
            margin-bottom: 20px;
        }

        .vote-group label {
            display: block;
            font-size: 1rem;
            margin-bottom: 8px;
            color: var(--text);
            font-weight: 600;
        }

        @media(min-width: 768px) {
            .vote-group label {
                font-size: 1.1rem;
            }
        }

        .vote-group label span {
            color: var(--primary);
        }

        .vote-group .optional {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: normal;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-submit-vote {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            background-color: var(--primary);
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-submit-vote:hover {
            background-color: var(--primary-hover);
        }

        /* Modal de Sucesso */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid var(--primary);
            box-shadow: 0 0 20px rgba(255, 183, 3, 0.3);
        }

        .modal-content h3 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .modal-content button {
            margin-top: 20px;
        }
    </style>
</head>
